<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
        letter-spacing: 0;
      }
      .code {
        font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      }
    </style>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>

  <text x="800" y="72" font-size="50" font-weight="700" fill="#172033" text-anchor="middle">C++ Sender/Receiver 执行协议</text>
  <text x="800" y="115" font-size="24" fill="#5b6475" text-anchor="middle">Sender 描述计算，Receiver 接收完成，Operation State 持有一次运行</text>

  <!-- Sender: lazy composition -->
  <rect x="55" y="155" width="430" height="600" rx="22" fill="#ffffff" stroke="#d8e0ea" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="155" width="430" height="82" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="90" y="195" class="code" font-size="29" font-weight="700" fill="#1d4ed8">Sender</text>
  <text x="90" y="224" font-size="17" fill="#64748b">惰性的计算描述</text>

  <rect x="90" y="275" width="360" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="270" y="316" class="code" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">schedule(scheduler)</text>

  <line x1="270" y1="341" x2="270" y2="377" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="291" y="367" class="code" font-size="16" fill="#64748b">|</text>

  <rect x="90" y="382" width="360" height="66" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="270" y="423" class="code" font-size="22" font-weight="700" fill="#047857" text-anchor="middle">then(f)</text>

  <line x1="270" y1="448" x2="270" y2="484" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="291" y="474" class="code" font-size="16" fill="#64748b">|</text>

  <rect x="90" y="489" width="360" height="66" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="270" y="530" class="code" font-size="22" font-weight="700" fill="#c2410c" text-anchor="middle">let_value(g)</text>

  <text x="270" y="601" font-size="17" fill="#64748b" text-anchor="middle">每个算法接收 Sender</text>
  <text x="270" y="629" font-size="17" fill="#64748b" text-anchor="middle">并返回一个新的 Sender</text>

  <rect x="90" y="669" width="360" height="54" rx="12" fill="#172033" stroke="#172033" stroke-width="2"/>
  <text x="270" y="704" class="code" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">sender auto computation</text>

  <!-- Lifecycle: connect then start -->
  <rect x="535" y="155" width="530" height="600" rx="22" fill="#111827" stroke="#111827" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="203" font-size="27" font-weight="700" fill="#ffffff" text-anchor="middle">一次异步操作的生命周期</text>
  <text x="800" y="231" font-size="16" fill="#94a3b8" text-anchor="middle">构造阶段不执行工作，start 才真正启动</text>

  <rect x="580" y="269" width="170" height="52" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="665" y="302" class="code" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">sender</text>
  <rect x="850" y="269" width="170" height="52" rx="11" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="935" y="302" class="code" font-size="19" font-weight="700" fill="#6d28d9" text-anchor="middle">receiver</text>

  <path d="M665 321 C665 344 716 344 735 365" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M935 321 C935 344 884 344 865 365" fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-gray)"/>

  <rect x="640" y="370" width="320" height="61" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="800" y="408" class="code" font-size="21" font-weight="700" fill="#7dd3fc" text-anchor="middle">connect(sender, receiver)</text>

  <line x1="800" y1="431" x2="800" y2="469" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow-gray)"/>

  <rect x="650" y="474" width="300" height="65" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="800" y="501" class="code" font-size="19" font-weight="700" fill="#172033" text-anchor="middle">operation_state</text>
  <text x="800" y="526" font-size="15" fill="#64748b" text-anchor="middle">保存运行所需的状态与生命周期</text>

  <line x1="800" y1="539" x2="800" y2="577" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="685" y="582" width="230" height="56" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="800" y="618" class="code" font-size="22" font-weight="700" fill="#c2410c" text-anchor="middle">start(op)</text>

  <line x1="800" y1="638" x2="800" y2="671" stroke="#34d399" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="635" y="676" width="330" height="52" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="800" y="698" class="code" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">Scheduler / execution context</text>
  <text x="800" y="718" font-size="14" fill="#a7f3d0" text-anchor="middle">选择执行资源并运行工作</text>

  <!-- Receiver: one completion signal -->
  <rect x="1115" y="155" width="430" height="600" rx="22" fill="#ffffff" stroke="#d8e0ea" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1115" y="155" width="430" height="82" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1150" y="195" class="code" font-size="29" font-weight="700" fill="#6d28d9">Receiver</text>
  <text x="1150" y="224" font-size="17" fill="#64748b">完成信号的处理器</text>

  <text x="1330" y="283" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">操作完成时三选一</text>

  <rect x="1150" y="315" width="360" height="72" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <circle cx="1183" cy="351" r="13" fill="#059669"/>
  <text x="1210" y="359" class="code" font-size="21" font-weight="700" fill="#047857">set_value(values...)</text>

  <rect x="1150" y="415" width="360" height="72" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <circle cx="1183" cy="451" r="13" fill="#dc2626"/>
  <text x="1210" y="459" class="code" font-size="21" font-weight="700" fill="#b91c1c">set_error(error)</text>

  <rect x="1150" y="515" width="360" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="1183" cy="551" r="13" fill="#64748b"/>
  <text x="1210" y="559" class="code" font-size="21" font-weight="700" fill="#475569">set_stopped()</text>

  <rect x="1150" y="635" width="360" height="77" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1175" y="665" class="code" font-size="18" font-weight="700" fill="#475569">get_env(receiver)</text>
  <text x="1175" y="694" font-size="15" fill="#64748b">提供停止令牌、调度器等环境查询</text>

  <!-- Cross-panel protocol arrows -->
  <path d="M450 696 C500 696 504 295 580 295" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow-blue)"/>
  <path d="M1150 675 C1088 675 1088 295 1020 295" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>
  <path d="M965 702 C1084 702 1065 351 1150 351" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M965 702 C1094 702 1072 451 1150 451" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
  <path d="M965 702 C1104 702 1082 551 1150 551" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>

  <!-- Summary -->
  <rect x="170" y="805" width="1260" height="58" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="842" class="code" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Sender + Receiver  →  connect  →  Operation State  →  start  →  exactly one completion signal</text>
</svg>
