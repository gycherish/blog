<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
        letter-spacing: 0;
      }
      .title { font-size: 54px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 27px; fill: #5b6475; }
      .label { font-size: 29px; font-weight: 700; fill: #172033; }
      .body { font-size: 22px; fill: #64748b; }
      .small { font-size: 18px; fill: #64748b; }
      .code { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
    </style>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>

  <text x="800" y="105" text-anchor="middle" class="title">从零搭建虚拟磁带库</text>
  <text x="800" y="153" text-anchor="middle" class="subtitle">mhvtl 实操笔记：SCSI 总线、机械臂、磁带机与 tar 备份</text>

  <rect x="85" y="230" width="395" height="365" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="282" y="292" text-anchor="middle" class="label" fill="#2563eb">Rocky Linux 主机</text>

  <rect x="135" y="335" width="295" height="60" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="282" y="374" text-anchor="middle" class="code" font-size="24" font-weight="700" fill="#2563eb">mtx -f /dev/sg*</text>

  <rect x="135" y="430" width="295" height="60" rx="16" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
  <text x="282" y="469" text-anchor="middle" class="code" font-size="24" font-weight="700" fill="#059669">tar cvf /dev/nst*</text>

  <rect x="135" y="525" width="295" height="42" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="282" y="553" text-anchor="middle" class="small">换带、写入、定位、恢复</text>

  <rect x="590" y="225" width="420" height="370" rx="34" fill="#111827" stroke="#111827" stroke-width="1" filter="url(#shadow)"/>
  <text x="800" y="292" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff">mhvtl</text>
  <text x="800" y="332" text-anchor="middle" class="code" font-size="23" font-weight="700" fill="#93c5fd">Virtual Tape Library</text>

  <rect x="655" y="378" width="290" height="55" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="800" y="414" text-anchor="middle" class="code" font-size="23" font-weight="700" fill="#e0f2fe">mhvtl.ko 伪 SCSI HBA</text>

  <rect x="655" y="465" width="130" height="55" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="720" y="501" text-anchor="middle" class="code" font-size="21" font-weight="700" fill="#7c3aed">vtllibrary</text>

  <rect x="815" y="465" width="130" height="55" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="880" y="501" text-anchor="middle" class="code" font-size="22" font-weight="700" fill="#ea580c">vtltape</text>

  <rect x="1120" y="205" width="400" height="430" rx="30" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="1320" y="265" text-anchor="middle" class="label" fill="#7c3aed">虚拟磁带库</text>

  <rect x="1170" y="315" width="140" height="235" rx="18" fill="#eef2ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="1240" y="350" text-anchor="middle" class="body" fill="#7c3aed">槽位</text>
  <rect x="1192" y="375" width="96" height="22" rx="6" fill="#2563eb"/>
  <rect x="1192" y="412" width="96" height="22" rx="6" fill="#059669"/>
  <rect x="1192" y="449" width="96" height="22" rx="6" fill="#ea580c"/>
  <rect x="1192" y="486" width="96" height="22" rx="6" fill="#7c3aed"/>
  <text x="1240" y="535" text-anchor="middle" class="code" font-size="20" font-weight="700" fill="#172033">E01001L8</text>

  <rect x="1355" y="315" width="105" height="235" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1408" y="350" text-anchor="middle" class="body" fill="#172033">驱动器</text>
  <rect x="1375" y="385" width="65" height="52" rx="10" fill="#111827"/>
  <text x="1408" y="418" text-anchor="middle" class="code" font-size="18" font-weight="700" fill="#e0f2fe">LTO-8</text>
  <rect x="1375" y="472" width="65" height="52" rx="10" fill="#111827"/>
  <text x="1408" y="505" text-anchor="middle" class="code" font-size="18" font-weight="700" fill="#e0f2fe">LTO-8</text>

  <path d="M1310 430 C1330 400 1342 405 1355 410" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <circle cx="1325" cy="430" r="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="1325" y="437" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">臂</text>

  <path d="M480 408 C525 408 545 408 590 408" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="535" y="384" text-anchor="middle" class="code" font-size="18" font-weight="700" fill="#2563eb">SCSI 命令</text>

  <path d="M1010 408 C1055 408 1075 408 1120 408" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="1065" y="384" text-anchor="middle" class="code" font-size="18" font-weight="700" fill="#7c3aed">模拟设备</text>

  <rect x="250" y="710" width="1100" height="72" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="330" y1="746" x2="1270" y2="746" stroke="#cbd5e1" stroke-width="4"/>

  <circle cx="400" cy="746" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <text x="400" y="754" text-anchor="middle" font-size="21" font-weight="700" fill="#2563eb">装</text>
  <text x="400" y="825" text-anchor="middle" class="small">mtx load</text>

  <circle cx="665" cy="746" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="4"/>
  <text x="665" y="754" text-anchor="middle" font-size="21" font-weight="700" fill="#059669">写</text>
  <text x="665" y="825" text-anchor="middle" class="small">tar backup</text>

  <circle cx="930" cy="746" r="24" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="930" y="754" text-anchor="middle" font-size="21" font-weight="700" fill="#ea580c">定</text>
  <text x="930" y="825" text-anchor="middle" class="small">mt fsf</text>

  <circle cx="1200" cy="746" r="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/>
  <text x="1200" y="754" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3aed">验</text>
  <text x="1200" y="825" text-anchor="middle" class="small">restore + sha256</text>
</svg>
