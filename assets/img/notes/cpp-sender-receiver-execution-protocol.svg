<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
        letter-spacing: 0;
      }
      .code {
        font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      }
    </style>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="900" height="383" fill="#f7f9fc"/>

  <text x="450" y="43" font-size="31" font-weight="700" fill="#172033" text-anchor="middle">C++ Sender/Receiver</text>
  <text x="450" y="72" font-size="15" fill="#5b6475" text-anchor="middle">描述计算，连接完成处理器，启动后发送且只发送一种完成信号</text>

  <!-- Sender composition -->
  <rect x="24" y="96" width="250" height="230" rx="14" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="96" width="250" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="43" y="121" class="code" font-size="18" font-weight="700" fill="#1d4ed8">Sender</text>
  <text x="43" y="139" font-size="10.5" fill="#64748b">惰性的计算描述，可以继续组合</text>

  <rect x="43" y="163" width="212" height="34" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="149" y="185" class="code" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">schedule(scheduler)</text>
  <line x1="149" y1="197" x2="149" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="43" y="215" width="212" height="34" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="149" y="237" class="code" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">then(f)</text>
  <line x1="149" y1="249" x2="149" y2="262" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="43" y="267" width="212" height="34" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="149" y="289" class="code" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">let_value(g)</text>

  <text x="149" y="317" font-size="10.5" fill="#64748b" text-anchor="middle">算法接收 Sender，并返回新的 Sender</text>

  <!-- connect/start lifecycle -->
  <rect x="300" y="96" width="300" height="230" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="124" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">一次异步操作的生命周期</text>
  <text x="450" y="143" font-size="10.5" fill="#94a3b8" text-anchor="middle">构造阶段不执行工作，start 才真正启动</text>

  <rect x="334" y="158" width="96" height="25" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="382" y="175" class="code" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">sender</text>
  <rect x="470" y="158" width="96" height="25" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="518" y="175" class="code" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">receiver</text>

  <path d="M382 183 C382 193 407 193 418 202" fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M518 183 C518 193 493 193 482 202" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="347" y="207" width="206" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="450" y="228" class="code" font-size="11.5" font-weight="700" fill="#7dd3fc" text-anchor="middle">connect(sender, receiver)</text>
  <line x1="450" y1="239" x2="450" y2="250" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="362" y="255" width="176" height="31" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="450" y="275" class="code" font-size="11.5" font-weight="700" fill="#172033" text-anchor="middle">operation_state</text>
  <line x1="450" y1="286" x2="450" y2="297" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-orange)"/>

  <rect x="394" y="302" width="112" height="18" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="450" y="315" class="code" font-size="9.8" font-weight="700" fill="#c2410c" text-anchor="middle">start(op)</text>

  <!-- Receiver completion -->
  <rect x="626" y="96" width="250" height="230" rx="14" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="626" y="96" width="250" height="52" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="121" class="code" font-size="18" font-weight="700" fill="#6d28d9">Receiver</text>
  <text x="645" y="139" font-size="10.5" fill="#64748b">操作完成时，三种信号只选一种</text>

  <rect x="645" y="163" width="212" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.7"/>
  <circle cx="663" cy="180" r="6" fill="#059669"/>
  <text x="678" y="185" class="code" font-size="11.5" font-weight="700" fill="#047857">set_value(values...)</text>

  <rect x="645" y="211" width="212" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.7"/>
  <circle cx="663" cy="228" r="6" fill="#dc2626"/>
  <text x="678" y="233" class="code" font-size="11.5" font-weight="700" fill="#b91c1c">set_error(error)</text>

  <rect x="645" y="259" width="212" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.7"/>
  <circle cx="663" cy="276" r="6" fill="#64748b"/>
  <text x="678" y="281" class="code" font-size="11.5" font-weight="700" fill="#475569">set_stopped()</text>

  <rect x="645" y="304" width="212" height="16" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="751" y="315" class="code" font-size="8.5" font-weight="700" fill="#475569" text-anchor="middle">get_env(receiver): stop token · scheduler</text>

  <!-- Protocol relationships -->
  <path d="M255 284 C280 284 287 170 334 170" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <path d="M506 311 C601 311 595 180 645 180" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M506 311 C608 311 604 228 645 228" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <path d="M506 311 C615 311 613 276 645 276" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- Summary -->
  <rect x="92" y="344" width="716" height="27" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="450" y="362" class="code" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Sender + Receiver → connect → Operation State → start → one completion signal</text>
</svg>
