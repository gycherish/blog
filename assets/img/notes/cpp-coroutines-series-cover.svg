<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
        letter-spacing: 0;
      }
      .code {
        font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      }
    </style>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="900" height="383" fill="#f7f9fc"/>

  <text x="450" y="43" font-size="31" font-weight="700" fill="#172033" text-anchor="middle">C++ 协程</text>
  <text x="450" y="72" font-size="15" fill="#5b6475" text-anchor="middle">编译器负责调用时机，类型作者决定具体行为</text>

  <!-- Promise -->
  <rect x="24" y="96" width="260" height="230" rx="14" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="24" y="96" width="260" height="52" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="43" y="121" class="code" font-size="18" font-weight="700" fill="#047857">Promise</text>
  <text x="43" y="139" font-size="10.5" fill="#64748b">定制整个协程的生命周期</text>

  <rect x="40" y="162" width="228" height="29" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="154" y="181" class="code" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">get_return_object()</text>

  <rect x="40" y="201" width="108" height="29" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="94" y="220" class="code" font-size="9.3" font-weight="700" fill="#1d4ed8" text-anchor="middle">initial_suspend()</text>
  <rect x="160" y="201" width="108" height="29" rx="7" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="214" y="220" class="code" font-size="9.3" font-weight="700" fill="#c2410c" text-anchor="middle">final_suspend()</text>

  <rect x="40" y="240" width="108" height="29" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="94" y="259" class="code" font-size="9.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">return_value()</text>
  <rect x="160" y="240" width="108" height="29" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="214" y="259" class="code" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">yield_value()</text>

  <rect x="40" y="279" width="108" height="29" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="94" y="298" class="code" font-size="8.8" font-weight="700" fill="#b91c1c" text-anchor="middle">unhandled_exception()</text>
  <rect x="160" y="279" width="108" height="29" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="214" y="298" class="code" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">await_transform()</text>

  <!-- Compiler lifecycle -->
  <rect x="310" y="96" width="280" height="230" rx="14" fill="#111827" stroke="#111827" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="126" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">编译器编排生命周期</text>
  <text x="450" y="145" font-size="10.5" fill="#94a3b8" text-anchor="middle">调用定制点，并保存跨挂起状态</text>

  <rect x="346" y="161" width="208" height="30" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="450" y="181" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">创建状态与 Promise</text>
  <line x1="450" y1="191" x2="450" y2="202" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="346" y="207" width="208" height="30" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="227" class="code" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">initial_suspend()</text>
  <line x1="450" y1="237" x2="450" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="333" y="253" width="234" height="30" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="273" class="code" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">co_await · co_yield · co_return</text>
  <line x1="450" y1="283" x2="450" y2="294" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="346" y="299" width="208" height="20" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="450" y="313" class="code" font-size="9.5" font-weight="700" fill="#c2410c" text-anchor="middle">final_suspend() → destroy</text>

  <!-- Awaiter -->
  <rect x="616" y="96" width="260" height="230" rx="14" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="616" y="96" width="260" height="52" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="635" y="121" class="code" font-size="18" font-weight="700" fill="#1d4ed8">Awaiter</text>
  <text x="635" y="139" font-size="10.5" fill="#64748b">定制一次等待怎样挂起与恢复</text>

  <rect x="635" y="164" width="222" height="35" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="186" class="code" font-size="11.5" font-weight="700" fill="#047857">await_ready()</text>
  <text x="840" y="186" font-size="10" fill="#64748b" text-anchor="end">是否就绪</text>

  <rect x="635" y="211" width="222" height="41" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="650" y="229" class="code" font-size="11.5" font-weight="700" fill="#c2410c">await_suspend(handle)</text>
  <text x="650" y="245" class="code" font-size="8.8" fill="#64748b">void / bool / coroutine_handle</text>

  <rect x="635" y="264" width="222" height="35" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="650" y="286" class="code" font-size="11.5" font-weight="700" fill="#1d4ed8">await_resume()</text>
  <text x="840" y="286" font-size="10" fill="#64748b" text-anchor="end">产生结果</text>

  <rect x="635" y="307" width="222" height="13" rx="5" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
  <text x="746" y="317" class="code" font-size="7.8" font-weight="700" fill="#6d28d9" text-anchor="middle">coroutine_handle: resume · destroy · promise</text>

  <!-- Relationships -->
  <path d="M284 215 C295 215 299 207 310 207" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <path d="M590 253 C601 253 605 232 616 232" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>

  <!-- Summary -->
  <rect x="100" y="344" width="700" height="27" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="450" y="362" font-size="11.5" fill="#475569" text-anchor="middle">Promise 定制整个协程 · Awaiter 定制一次等待 · Handle 提供外部控制</text>
</svg>
